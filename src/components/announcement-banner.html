<!-- ==========================================================================
     COMPONENTE REUTILIZABLE: AnnouncementCard (Tarjeta de Novedad del Hero)
     ==========================================================================
     
     Ubicación: Hero de la Home (zona superior izquierda, bajo el header de navegación).
     Estilos: src/css/styles.css (.hero__announcement, .announcement-card)
     Lógica y configuración central: src/js/main.js (ANNOUNCEMENT_CONFIG, initAnnouncementBanner)

     Propiedades del componente:
     - label:       Insignia/etiqueta temporal (ej: "Nuevo", "Nou", "New", "Campaña").
     - title:       Título del servicio o novedad (ej: "Ski & Snow").
     - description: Explicación breve (se muestra en desktop/tablet; se oculta en mobile para diseño limpio).
     - href:        Ruta de destino (ej: "../es/snow-performance/").
     - active:      Control de visibilidad ("true" para mostrar, "false" para ocultar vía data-announcement-active o .hero__announcement--hidden).

     Uso en HTML (ejemplo en español):
-->
<aside class="hero__announcement" aria-label="Novedad destacada" data-announcement-active="true">
  <div class="container hero__announcement-inner">
    <a class="announcement-card" href="../es/snow-performance/" data-announcement data-announcement-auto>
      <div class="announcement-card__header">
        <span class="announcement-card__badge">Nuevo</span>
      </div>
      <span class="announcement-card__title">Ski &amp; Snow</span>
      <p class="announcement-card__desc">Preparación, prevención y recuperación para tu temporada de esquí.</p>
      <div class="announcement-card__footer">
        <span class="announcement-card__cta">
          <span class="announcement-card__cta-text">Descubrir</span>
          <svg class="announcement-card__cta-arrow" width="13" height="9" viewBox="0 0 13 9" fill="none" aria-hidden="true">
            <path d="M1 4.5h11M8 1l3.5 3.5L8 8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </div>
    </a>
  </div>
</aside>
